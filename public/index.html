<!doctype html>
<html lang="en">
  <head>
    <title>CS4241 Assignment 2</title>
    <meta
      charset="utf-8"
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="daily drink tracker with additional notes"
    />

    <script src="js/login.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tacit-css@1.9.7/dist/tacit-css.min.css"
      integrity="sha384-D/LLHCkqHnoJ7y04sSEBX95s7wMjBn45wtHneRfp03QBgt6+a6Pz2eLUC4N1CAI0"
      crossorigin="anonymous"
    />

    <!-- get rid of favicon error -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  </head>
  <body>
    <h1>daily drinks</h1>
    <div class="login">
      <main>
        <div
          id="error-message"
          style="display: none; font-style: italic; color: gray"
        ></div>
        <form id="loginForm" action="/login" method="POST">
          <h2>login</h2>
          <p>
            sign in with an exisiting username or password. if no username
            exists, a new account will be created with the entered credentials.
          </p>

          <p>
            <label for="username">username:</label>
            <input type="text" id="username" placeholder="username" />
          </p>

          <p>
            <label for="password">password:</label>
            <input type="password" id="password" placeholder="password" />
          </p>

          <button id="login" type="submit">login</button>
        </form>
      </main>
    </div>
  </body>
</html>
